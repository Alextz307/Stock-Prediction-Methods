[tool.poetry]
name = "stock_prediction_methods"
version = "0.1.0"
description = "Hybrid Pipeline Integrating Econometrics and Deep Learning"
authors = ["Alexandru Lorintz"]
packages = [{include = "src"}, {include = "config"}]

[tool.poetry.dependencies]
python = "^3.12"
pandas = "^2.2.0"
numpy = "^1.26.0"
scipy = "^1.11.0"
arch = "^7.0.0" 
torch = "^2.1.0"
scikit-learn = "^1.3.0"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
xgboost = "^3.1.3"
tabulate = "^0.9.0"
yfinance = "^0.2.33"
optuna = "^4.6.0"

[tool.poetry.group.dev.dependencies]
mypy = "^1.8.0"
pandas-stubs = "^2.1.0"

ruff = "^0.1.0"
jupyter = "^1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
